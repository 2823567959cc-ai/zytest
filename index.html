var idx=0, ans=new Array(40).fill(null);
var dims={
  '社交边界':[0,1,2,3,4],
  '穿着与外在':[5,6,7,8,9],
  '手机与隐私':[10,11,12,13,14,15],
  '社交媒体':[16,17,18,19,20],
  '行踪与时间':[21,22,23,24,25],
  '工作与事业':[26,27,28,29,30],
  '过去与前任':[31,32,33,34],
  '综合行为':[35,36,37,38,39]
};

function dimScores(){
  var r={};
  for(var k in dims){
    var ids=dims[k], v=ids.filter(function(i){return ans[i]!==null});
    r[k]=v.length?Math.round(v.reduce(function(s,i){return s+ans[i]},0)/v.length):0;
  }
  return r;
}
function total(){return ans.reduce(function(s,v){return s+(v||0)},0);}

function grade(sc){
  if(sc<=55) return{emoji:'\uD83D\uDD4A\uFE0F',lv:'佛系男友',sum:'你像在和自己谈恋爱，他是不是忘了还有个女朋友？他的字典里大概没有\u201c占有\u201d两个字。你自由得像一阵风，但偶尔也希望他能表现出一点点在乎。'};
  if(sc<=75) return{emoji:'\uD83D\uDC9A',lv:'适度关心',sum:'松弛有度，这才是成年人该有的恋爱节奏。他在乎你但不控制你，关心你但不监视你。你们之间有信任、有空间、也有甜蜜。这是最健康的恋爱状态，请珍惜。'};
  if(sc<=95) return{emoji:'\uD83D\uDC9B',lv:'轻度紧张',sum:'偶尔绷得太紧，但他大概率只是太喜欢你。有些小醋意是生活的调味剂，但如果某些行为已经让你感到不舒服，就是时候好好聊聊了。'};
  if(sc<=120) return{emoji:'\uD83D\uDFE0',lv:'偏强占有',sum:'红色预警频闪，你的社交圈正在被他\u201c格式化\u201d。他的不安全感已经影响到你的正常生活。你会发现自己越来越不敢做真实的自己，因为怕他生气。'};
  if(sc<=140) return{emoji:'\uD83D\uDD34',lv:'重度控制',sum:'你已经快没有自己的独立空间了，这很危险。你的手机、社交、穿着、行踪几乎都在他的掌控之下。这不是恋爱，是被圈养。'};
  return{emoji:'\uD83D\uDC80',lv:'窒息式占有',sum:'你不是女朋友，你是他的私有财产。他的行为已经超出了吃醋的范畴，进入了情感控制的危险领域。你的安全和自由比任何爱情都重要。'};
}

function render(){
  var q=questions[idx];
  $('pf').style.width=((idx+1)/40*100)+'%';
  $('pt').textContent=(idx+1)+' / 40';
  $('ctag').textContent=q.cat;
  $('ctag').className='ctag '+q.cls;
  $('qt').textContent=q.q;
  $('qos').textContent='（'+q.os+'）';
  var cnt=$('ops'); cnt.innerHTML='';
  q.opts.forEach(function(o,i){
    var d=document.createElement('div');
    d.className='op'+(ans[idx]===i?' sel':'');
    d.innerHTML='<span class="ol">'+o.l+'.</span>'+o.t+'<span class="oos">'+o.os+'</span>';
    d.onclick=function(){select(i)};
    cnt.appendChild(d);
  });
  var soFar=total(), pct=soFar/160*100;
  var tf=$('tf'); tf.style.width=pct+'%';
  if(pct<30)tf.style.background='#48c774';
  else if(pct<50)tf.style.background='#ffb347';
  else if(pct<75)tf.style.background='#ff6b9d';
  else tf.style.background='#ff3860';
  $('btnPrev').style.display=idx>0?'inline-block':'none';
  var bn=$('btnNext');
  if(idx===39){bn.textContent='查看结果';bn.onclick=showResult;}
  else{bn.textContent='下一题';bn.onclick=nextQ;}
  bn.disabled=ans[idx]===null;
  bn.style.opacity=ans[idx]===null?'0.5':'1';
}
function select(i){
  ans[idx]=i;
  var ops=document.querySelectorAll('.op');
  ops.forEach(function(el,j){el.classList.toggle('sel',j===i)});
  var soFar=total(), pct=soFar/160*100;
  var tf=$('tf'); tf.style.width=pct+'%';
  if(pct<30)tf.style.background='#48c774';
  else if(pct<50)tf.style.background='#ffb347';
  else if(pct<75)tf.style.background='#ff6b9d';
  else tf.style.background='#ff3860';
  setTimeout(function(){
    if(idx===39)showResult();else nextQ();
  },300);
}
function nextQ(){if(ans[idx]!==null&&idx<39){idx++;render()}}
function prevQ(){if(idx>0){idx--;render()}}

function showResult(){
  if(ans[idx]===null)return;
  $('quiz').classList.remove('on');
  $('result').classList.add('on');
  var sc=total(), g=grade(sc);
  $('rg').textContent=g.emoji;
  $('rl').textContent='你的男朋友：'+g.lv;
  $('rs').textContent='得分 '+sc+' / 160（满分160）';
  $('ryp').innerHTML='<strong>'+g.sum.split('。')[0]+'。</strong><br><br>'+g.sum;
  var ds=dimScores();
  var colors={'社交边界':'#3b82f6','穿着与外在':'#ec4899','手机与隐私':'#d97706','社交媒体':'#7c3aed','行踪与时间':'#dc2626','工作与事业':'#059669','过去与前任':'#be185d','综合行为':'#4f46e5'};
  $('rd').innerHTML='<h3>各维度分析</h3>'+Object.keys(ds).map(function(k){
    var v=ds[k], pct=Math.round(v/4*100);
    return '<div class="db"><span class="dl">'+k+'</span><div class="dt"><div class="df" style="width:'+pct+'%;background:'+colors[k]+'"></div></div><span class="ds">'+v+'/4</span></div>';
  }).join('');
  setTimeout(drawRadar,200);
}

function drawRadar(){
  var c=$('radar'),ctx=c.getContext('2d');
  var sz=280;c.width=sz*2;c.height=sz*2;
  var cx=sz,cy=sz,r=sz*0.6;
  var ds=dimScores(),labels=Object.keys(ds),values=Object.values(ds);
  var n=labels.length,step=Math.PI*2/n;
  ctx.clearRect(0,0,sz*2,sz*2);
  for(var lv=1;lv<=4;lv++){
    ctx.beginPath();
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+i*step,rr=r*lv/4;
      var x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=lv===4?'#e8d4e0':'#f0e4ec';ctx.lineWidth=1;ctx.stroke();
    if(lv===4){
      for(var j=0;j<n;j++){
        var a2=-Math.PI/2+j*step;
        var x2=cx+(r+14)*Math.cos(a2),y2=cy+(r+14)*Math.sin(a2);
        ctx.fillStyle='#7c6f8c';ctx.font='bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(labels[j],x2,y2);
      }
    }
  }
  for(var k=0;k<n;k++){
    var a3=-Math.PI/2+k*step;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a3),cy+r*Math.sin(a3));
    ctx.strokeStyle='#f0e4ec';ctx.stroke();
  }
  ctx.beginPath();
  for(var m=0;m<n;m++){
    var a4=-Math.PI/2+m*step,rr2=r*values[m]/4;
    var x3=cx+rr2*Math.cos(a4),y3=cy+rr2*Math.sin(a4);
    if(m===0)ctx.moveTo(x3,y3);else ctx.lineTo(x3,y3);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(199,125,255,0.2)';ctx.fill();
  ctx.strokeStyle='#c77dff';ctx.lineWidth=2.5;ctx.stroke();
  for(var p=0;p<n;p++){
    var a5=-Math.PI/2+p*step,rr3=r*values[p]/4;
    var x4=cx+rr3*Math.cos(a5),y4=cy+rr3*Math.sin(a5);
    ctx.beginPath();ctx.arc(x4,y4,5,0,Math.PI*2);
    ctx.fillStyle='#c77dff';ctx.fill();
    ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();
  }
}

function shareRes(){
  var sc=total(),g=grade(sc);
  var lines=['你的男朋友占有欲测试','得分：'+sc+'/160','等级：'+g.lv+' '+g.emoji,'—',g.sum.split('。')[0]+'。'];
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    alert('分享文本已复制到剪贴板！');
  }).catch(function(){
    alert('复制失败，请手动截图分享');
  });
}

  if(!$('quiz').classList.contains('on'))return;
  if(e.key>='1'&&e.key<='4')select(parseInt(e.key)-1);
  else if(e.key==='ArrowLeft')prevQ();
  else if(e.key==='ArrowRight'||e.key==='Enter'){
    if(idx===39)showResult();else nextQ();
  }
});
})();
</script>
</body>
